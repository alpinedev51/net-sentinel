services:
  traefik:
    image: traefik:v3.0
    container_name: net_sentinel_proxy
    restart: unless-stopped
    command:
      - "--api.insecure=true" # Enables the Traefik Dashboard at http://localhost:8080
      - "--providers.docker=true" # Tells Traefik to listen to the Docker daemon
      - "--providers.docker.exposedbydefault=false" # Secure default: don't expose containers unless explicitly labeled
      - "--entrypoints.web.address=:80" # Define port 80 entrypoint
      - "--entrypoints.websecure.address=:443" # Define port 443 entrypoint
      # Force HTTP to HTTPS redirection globally
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard Port
    volumes:
      # Traefik needs to read the Docker socket to auto-discover other containers
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: postgres:18-alpine
    container_name: net_sentinel_db
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinelpassword
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: net_sentinel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: net_sentinel_api
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinelpassword@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    labels:
      - "traefik.enable=true"
      # Route any traffic hitting https://localhost/api to this backend container
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      # Route MCP traffic hitting https://localhost/mcp to this same container
      - "traefik.http.routers.mcp.rule=Host(`localhost`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"
      # Tell Traefik which internal container port to send traffic to
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: net_sentinel_ui
    environment:
      - VITE_API_URL=https://localhost/api
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      # Route all other root traffic to the frontend react container
      - "traefik.http.routers.frontend.rule=Host(`localhost`) && PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

volumes:
  postgres_data:
  redis_data:
